name: Publish Lean descriptors

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    name: Export, verify, and publish descriptors
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/descriptor-epoch/')
    runs-on: ubuntu-latest
    environment: descriptor-publish
    steps:
      # actions/checkout v4.3.1
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          lfs: false

      - name: Bootstrap pinned descriptor source of truth
        run: bash scripts/bootstrap_descriptor_source.sh

      - name: Export staged TSVs from Lean
        run: python3 scripts/emit_descriptors.py --export-staged-tsv "$RUNNER_TEMP/descriptors"

      - name: Require exact agreement with committed provenance
        run: python3 scripts/descriptor_store.py verify --source-dir "$RUNNER_TEMP/descriptors"

      - name: Read publish role configuration
        id: store
        run: |
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          config = json.loads(Path(".config/descriptor-store.json").read_text())
          with Path(os.environ["GITHUB_OUTPUT"]).open("a") as output:
              print(f"region={config['region']}", file=output)
              print(f"publish_role_arn={config['publish_role_arn']}", file=output)
          PY

      - name: Assume descriptor publish role
        # aws-actions/configure-aws-credentials v6.2.3
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c
        with:
          aws-region: ${{ steps.store.outputs.region }}
          role-to-assume: ${{ steps.store.outputs.publish_role_arn }}
          role-session-name: castalia-descriptor-publish

      - name: Publish and reverify immutable objects
        run: python3 scripts/descriptor_store.py publish --source-dir "$RUNNER_TEMP/descriptors"
